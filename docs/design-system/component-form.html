<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォーム — G.A Design &amp; Code DS</title>
<style>
/* =============================================================================
   フォーム(contact)
   実装: src/features/contact/components/Form/ + src/components/ui/{input,textarea,label}.tsx
   ---------------------------------------------------------------------------
   このサイトで唯一の入力面。1画面に収める制約があるので、項目を増やせない。
   検証は Conform + Zod、送信は Server Action。エラーは項目の直下に出す。
   ============================================================================= */
:root {
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --error: oklch(63.7% 0.237 25.331);   /* --custom-error-color */
  --success: oklch(72.3% 0.219 149.579); /* --custom-success-color */
  --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --radius: 0.625rem;
  --measure: 48rem;
  --sp-stack: 1.5rem; /* space-y-6 — 項目と項目のあいだ */
}

html, body { margin: 0; background: #f4f4f5; }
.ds-harness { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px;
  padding: 10px 14px; background: #18181b; color: #e4e4e7; font-family: var(--font-mono); font-size: 12px; }
.ds-harness .ds-title { font-weight: 700; color: #fff; letter-spacing: .04em; }
.ds-harness .ds-sub { color: #a1a1aa; }
.ds-harness .ds-note { margin-left: auto; color: #71717a; font-size: 11px; }
.ds-stage { background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); padding: 3rem 1.5rem; }
.ds-wrap { max-width: var(--measure); margin: 0 auto; }
.ds-case-meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-bottom: 1.25rem; }
.ds-sep { border-top: 1px solid var(--border); margin: 2.5rem 0 1.75rem; }

/* --- ここが実物 --- */
.form-stack { display: flex; flex-direction: column; align-items: center; gap: var(--sp-stack); }
.form-row { display: flex; flex-direction: column; width: 100%; max-width: 28rem; } /* max-w-md */
.form-label { font-size: 1rem; font-weight: 500; margin-bottom: .75rem; line-height: 1; }
.form-required { color: var(--error); }
.form-input, .form-textarea {
  width: 100%; border: 1px solid var(--input); background: transparent;
  border-radius: calc(var(--radius) - 2px); font-size: 1rem; font-family: inherit; color: var(--foreground);
  box-shadow: 0 1px 3px 0px hsl(0 0% 0% / .05); transition: box-shadow .15s ease, border-color .15s ease;
  outline: none; box-sizing: border-box;
}
.form-input { height: 2.25rem; padding: .25rem .75rem; }
.form-textarea { min-height: 8rem; padding: .5rem .75rem; resize: vertical; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--muted-foreground); }
.form-input:focus-visible, .form-textarea:focus-visible {
  border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
}
.form-input.is-invalid, .form-textarea.is-invalid {
  border-color: var(--error); box-shadow: 0 0 0 3px color-mix(in oklab, var(--error) 20%, transparent);
}
.form-error { margin-top: .375rem; font-size: .875rem; color: var(--error); }
.form-submit { margin-top: 2.5rem; width: 100%; display: inline-flex; align-items: center;
  justify-content: center; height: 2.25rem; border: 0; border-radius: calc(var(--radius) - 2px);
  background: var(--primary); color: var(--primary-foreground); font-size: .875rem; font-weight: 500;
  font-family: inherit; cursor: pointer; }
.form-submit:disabled { opacity: .5; pointer-events: none; }
@media (min-width: 768px) { .form-input, .form-textarea { font-size: .875rem; } }

.ds-out { margin-top: 2.5rem; border-left: 3px solid var(--border); padding-left: 1rem; }
.ds-out p { font-size: 1rem; line-height: 1.9; margin: 0 0 .75rem; }
.ds-out p:last-child { margin-bottom: 0; }
.ds-out code { font-family: var(--font-mono); font-size: .85em; }
</style>
</head>
<body>
<div class="ds-harness">
  <span class="ds-title">フォーム</span>
  <span class="ds-sub">入力 / ラベル / エラー / 送信</span>
  <span class="ds-note">Conform + Zod / Server Action</span>
</div>

<div class="ds-stage">
<div class="ds-wrap">

  <div class="ds-case-meta">通常の状態</div>
  <div class="form-stack">
    <div class="form-row">
      <label class="form-label" for="p-name">Full Name<span class="form-required">*</span></label>
      <input class="form-input" id="p-name" type="text">
    </div>
    <div class="form-row">
      <label class="form-label" for="p-mail">Email Address<span class="form-required">*</span></label>
      <input class="form-input" id="p-mail" type="email">
    </div>
    <div class="form-row">
      <label class="form-label" for="p-msg">Message<span class="form-required">*</span></label>
      <textarea class="form-textarea" id="p-msg" rows="6" placeholder="Your message here..."></textarea>
    </div>
  </div>
  <div class="form-row" style="max-width:28rem; margin:0 auto">
    <button class="form-submit" type="button">Submit</button>
  </div>

  <div class="ds-sep"></div>

  <div class="ds-case-meta">エラーと送信中</div>
  <div class="form-stack">
    <div class="form-row">
      <label class="form-label" for="p-mail2">Email Address<span class="form-required">*</span></label>
      <input class="form-input is-invalid" id="p-mail2" type="email" value="not-an-email" aria-invalid="true">
      <p class="form-error">Invalid email address</p>
    </div>
  </div>
  <div class="form-row" style="max-width:28rem; margin:1.5rem auto 0">
    <button class="form-submit" type="button" disabled>Sending...</button>
  </div>

  <div class="ds-out">
    <p>入力欄の幅は <code>max-w-md</code>(28rem)で、ページ幅の <code>max-w-3xl</code> より狭い。広すぎる入力欄は書きづらいため。</p>
    <p>エラーは項目の直下に <code>mt-1.5 text-sm</code> で出す。まとめて上部に出さない。</p>
    <p>項目を増やすとセクションが画面からはみ出す。増やす前に <a href="../adr/0002-one-section-per-screen.md">ADR-0002</a> の確認手順を読む。</p>
  </div>

</div>
</div>
</body>
</html>
